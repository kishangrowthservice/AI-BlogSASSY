name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck & Authorization Boundary Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite (Typecheck & Auth Boundary)
        run: npm test
        env:
          NODE_ENV: test
          ADMIN_SESSION_TOKEN: test_admin_token_ci
