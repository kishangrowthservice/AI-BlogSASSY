name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
          ADMIN_PASSWORD: dummy-admin-password
          ADMIN_SESSION_TOKEN: dummy-session-token
          CRON_SECRET: dummy-cron-secret

# NOTE: Automated verification scripts (scripts/verify_*.ts) are not included in CI yet.
# They require live credentials for Supabase, Groq, and Gemini.
# Follow-up: Add a test job once repository secrets (NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, GROQ_API_KEY, GEMINI_API_KEY) are configured
# in GitHub Settings -> Secrets and variables -> Actions.
